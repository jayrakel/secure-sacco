name: Dependency Security Scan

on:
  schedule:
    - cron: '0 22 * * *'  # 10 PM UTC, which is 1 AM EAT (Kenya Time)
  workflow_dispatch:

jobs:
  backend-owasp:
    name: Backend — OWASP NVD Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Check NVD API key presence
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is missing"
            exit 1
          fi
          echo "NVD_API_KEY is present"

      - name: Run OWASP Dependency Check
        working-directory: secure-sacco/backend/backend
        run: |
          mvn --batch-mode org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML

      - name: Trigger System Alerts on Failure
        if: failure()
        env:
          SYSTEM_ALERT_API_KEY: ${{ secrets.SYSTEM_ALERT_API_KEY }}
        run: |
          curl -X POST https://api.secure-sacco.com/api/v1/system-alerts/dispatch \
            -H "X-System-Alert-Api-Key: $SYSTEM_ALERT_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "source": "GitHub Actions",
              "service": "Dependency Scanner",
              "severity": "CRITICAL",
              "message": "OWASP Dependency Scan failed! New vulnerabilities detected."
            }'

      - name: Upload OWASP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_id }}
          path: secure-sacco/backend/backend/target/dependency-check-report.html
          retention-days: 30

  frontend-audit:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: secure-sacco/frontend/package-lock.json

      - name: Install deps
        working-directory: secure-sacco/frontend
        run: npm ci

      - name: npm audit (high and critical only)
        working-directory: secure-sacco/frontend
        run: npm audit --audit-level=high

  trivy-scan:
    name: Container — Trivy vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SAC-266: Trivy's fs scan on the backend resolves Maven dependency
      # versions for vulnerability matching, which was hitting Maven Central
      # directly and getting 429 rate-limited. Pre-resolving into ~/.m2 here
      # (with caching) means Trivy reads from the local repo instead of
      # making fresh network calls during the scan.
      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Pre-resolve Maven dependencies
        working-directory: secure-sacco/backend/backend
        run: mvn --batch-mode dependency:resolve
        continue-on-error: true

      - name: Run Trivy on backend Dockerfile
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: 'secure-sacco/backend/backend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on frontend Dockerfile
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: 'secure-sacco/frontend'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'